<script>
    var API_URL = "https://script.google.com/macros/s/AKfycbxmN--RKvLtxNIxzjf1wHDTVuDNxDvzrBK9O8kIXjRJCnN6sh-wKTEiX2PsJuhud93b/exec";
    
    var globalFiles = [];
    var likedPhotos = [];      
    var downloadPhotos = [];   
    var currentLightBoxIndex = 0;
    var isSelectionMode = false;
    var isDragging = false, touchTimer = null, lastTouchedIdx = null;

    window.onload = function() {
        var urlParams = new URLSearchParams(window.location.search);
        var albumId = urlParams.get('id');
        if (!albumId) { document.getElementById('loading-text').innerText = "Thiếu ID Album!"; return; }
        document.getElementById('link-1').innerText = window.location.href;

        fetch(API_URL + "?id=" + encodeURIComponent(albumId))
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                globalFiles = data.files;
                renderAlbum(data);
            } else {
                document.getElementById('loading-text').innerText = "Lỗi: " + data.message;
            }
        }).catch(err => {
            document.getElementById('loading-text').innerText = "Lỗi kết nối API: " + err;
        });
    };

    function renderAlbum(data) {
        if(data) {
            document.getElementById('album-title').innerText = data.album.albumName;
            document.getElementById('client-name').innerText = "Khách hàng: " + data.album.clientName;
            document.getElementById('total-photos').innerText = globalFiles.length;
            if (globalFiles.length > 0) {
                document.getElementById('cover-photo').src = globalFiles[0].viewUrl;
            }
        }

        var container = document.getElementById('gallery-container');
        container.innerHTML = "";

        globalFiles.forEach((file, index) => {
            var card = document.createElement('div');
            card.className = "photo-card";
            card.setAttribute("data-idx", index);
            
            if (downloadPhotos.includes(index)) card.classList.add('dl-selected');
            var isLiked = likedPhotos.includes(file.name);
            
            // ĐÃ KHẮC PHỤC: Dùng trực tiếp file.viewUrl vào src để ảnh hiện lên ngay lập tức
            card.innerHTML = 
                '<i class="fa-solid fa-check check-icon"></i>' +
                '<img src="' + file.viewUrl + '" alt="' + file.name + '" loading="lazy">' +
                '<button class="btn-heart-grid ' + (isLiked?'liked':'') + '" id="gh-' + index + '" onclick="toggleHeart(event, \'' + file.name + '\', ' + index + ')"><i class="' + (isLiked?'fa-solid':'fa-regular') + ' fa-heart"></i></button>' +
                '<div class="photo-info"><span class="photo-title">' + file.name + '</span></div>';
            
            card.onclick = () => { if(!isDragging) openLightbox(index); };
            container.appendChild(card);
        });
        document.getElementById('loading-screen').style.display = "none";
        setupTouchEvents();
    }

    function setupTouchEvents() {
        var gallery = document.getElementById('gallery-container');
        gallery.ontouchstart = (e) => {
            var card = e.target.closest('.photo-card');
            if (!card) return;
            touchTimer = setTimeout(() => {
                isDragging = true;
                if(navigator.vibrate) navigator.vibrate(50);
                toggleDownloadSelection(parseInt(card.getAttribute('data-idx')));
            }, 400);
        };
        gallery.ontouchmove = (e) => {
            if (!isDragging) { clearTimeout(touchTimer); return; }
            e.preventDefault();
            var touch = e.touches[0];
            var card = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.photo-card');
            if (card) {
                var idx = parseInt(card.getAttribute('data-idx'));
                if (idx !== lastTouchedIdx) {
                    toggleDownloadSelection(idx);
                    lastTouchedIdx = idx;
                }
            }
        };
        gallery.ontouchend = () => { clearTimeout(touchTimer); setTimeout(() => isDragging = false, 50); };
    }

    function toggleDownloadSelection(idx) {
        var card = document.querySelector('.photo-card[data-idx="'+idx+'"]');
        var pos = downloadPhotos.indexOf(idx);
        if (pos !== -1) { downloadPhotos.splice(pos, 1); card.classList.remove('dl-selected'); }
        else { downloadPhotos.push(idx); card.classList.add('dl-selected'); }
        
        var count = downloadPhotos.length;
        document.getElementById('dl-selected-count').innerText = count;
        document.getElementById('mobile-bar').classList.toggle('active', count > 0);
    }

    function deselectAllDownload() {
        downloadPhotos = [];
        document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('dl-selected'));
        document.getElementById('mobile-bar').classList.remove('active');
    }

    function downloadSelectedFiles() {
        if (downloadPhotos.length === 0) return;
        alert("Bắt đầu tải về " + downloadPhotos.length + " ảnh gốc chất lượng cao!");
        downloadPhotos.forEach((idx, i) => {
            setTimeout(() => {
                var a = document.createElement('a');
                a.href = globalFiles[idx].downloadUrl;
                a.download = globalFiles[idx].name;
                a.target = "_blank";
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }, i * 500);
        });
        deselectAllDownload();
    }

    function toggleHeart(e, name, idx) {
        e.stopPropagation();
        var btn = document.getElementById('gh-' + idx);
        var pos = likedPhotos.indexOf(name);
        if (pos !== -1) { likedPhotos.splice(pos, 1); btn.classList.remove('liked'); btn.querySelector('i').className = "fa-regular fa-heart"; }
        else { likedPhotos.push(name); btn.classList.add('liked'); btn.querySelector('i').className = "fa-solid fa-heart"; }
        document.getElementById('likes-count').innerText = likedPhotos.length;
        var subBtn = document.getElementById('btn-submit-list');
        subBtn.disabled = likedPhotos.length === 0;
        subBtn.classList.toggle('ready', likedPhotos.length > 0);
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function copyTxt(id) { navigator.clipboard.writeText(document.getElementById(id).value || document.getElementById(id).innerText); alert("Đã sao chép!"); }

    function applySortLocal(type) {
        document.querySelectorAll('.sort-item').forEach(e => e.classList.remove('selected'));
        document.getElementById('sort-' + type).classList.add('selected');
        if(type === 'az') globalFiles.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
        else globalFiles.sort((a,b) => b.name.localeCompare(a.name, undefined, {numeric: true}));
        renderAlbum(null);
        closeModal('modal-sort');
    }

    function setCover() { alert("Đã đặt " + globalFiles[currentLightBoxIndex].name + " làm ảnh bìa!"); }

    function openLightbox(idx) {
        currentLightBoxIndex = idx;
        var file = globalFiles[idx];
        document.getElementById('lb-img').src = file.viewUrl;
        document.getElementById('lb-counter').innerText = (idx + 1) + " / " + globalFiles.length;
        
        var dlBtn = document.getElementById('lb-download-btn');
        dlBtn.href = file.downloadUrl;
        dlBtn.download = file.name;

        updateLbHeartUI();
        document.getElementById('lightbox').style.display = "flex";
    }
    function closeLightbox() { document.getElementById('lightbox').style.display = "none"; }
    function changeLightbox(dir) {
        currentLightBoxIndex += dir;
        if(currentLightBoxIndex < 0) currentLightBoxIndex = globalFiles.length - 1;
        if(currentLightBoxIndex >= globalFiles.length) currentLightBoxIndex = 0;
        openLightbox(currentLightBoxIndex);
    }
    function toggleHeartFromLightbox() {
        toggleHeart({stopPropagation:()=>{}}, globalFiles[currentLightBoxIndex].name, currentLightBoxIndex);
        updateLbHeartUI();
    }
    function updateLbHeartUI() {
        var btn = document.getElementById('lb-btn-like');
        var isLiked = likedPhotos.includes(globalFiles[currentLightBoxIndex].name);
        btn.classList.toggle('liked', isLiked);
        btn.querySelector('i').className = isLiked ? "fa-solid fa-heart" : "fa-regular fa-heart";
    }

    function openResultModal() {
        document.getElementById('result-list').value = likedPhotos.join(', ');
        openModal('result-modal');
    }
</script>
